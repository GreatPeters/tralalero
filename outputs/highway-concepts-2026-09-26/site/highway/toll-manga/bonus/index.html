<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>보너스 · 10가지 이미지 시안</title><style>
:root{color-scheme:light;--ink:#112342;--paper:#f5f3e9;--gold:#e0ad35}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Malgun Gothic",sans-serif}header{max-width:1260px;margin:auto;padding:32px 24px 25px;display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:28px;margin:0}header p{font-size:14px;margin:8px 0 0;color:#52616f}a{color:inherit;text-underline-offset:4px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 22px;max-width:1260px;padding:0 24px 48px;margin:auto}.tile{display:block;position:relative;text-decoration:none;border-bottom:3px solid var(--ink);overflow:hidden;background:#c1d4dc}.tile img{display:block;width:100%;height:auto;transition:transform .2s}.tile:hover img{transform:scale(1.015)}.tile span{position:absolute;z-index:1;bottom:0;left:0;font-size:24px;font-weight:bold;background:var(--paper);padding:7px 16px}a:focus-visible,button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}dialog{width:100vw;height:100dvh;max-width:none;max-height:none;border:0;margin:0;padding:0;background:#101721;color:white}dialog::backdrop{background:#101721}.bar{height:64px;padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:#101721;z-index:2}.bar strong{margin-right:auto;font-size:20px}button,.bar a{font:inherit;color:inherit;background:transparent;border:1px solid #8b9aac;padding:8px 14px;border-radius:4px;text-decoration:none;cursor:pointer}.full{height:calc(100dvh - 64px);overflow:auto;text-align:center}.full img{display:block;margin:auto;height:100%;width:auto;max-width:100%;object-fit:contain}.full.zoom img{height:auto;width:min(1100px,100%);max-width:none}.prev,.next{position:fixed;top:50%;background:#101721b8;font-size:25px;z-index:3}.prev{left:14px}.next{right:14px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px;padding:0 14px 30px}header{padding:22px 14px}h1{font-size:24px}.bar{padding:10px;gap:6px}.bar a{display:none}.bar button{padding:8px 10px}}@media(prefers-reduced-motion:reduce){.tile img{transition:none}}
</style></head><body><header><div><h1>보너스 시안 10개</h1><p>이미지 제안 · 게임 미적용</p></div><a href="../">실제 적용 화면</a></header><main class="grid"><a class="tile" href="01.png" data-number="01" aria-label="1번 시안 크게 보기"><span>01</span><img src="01.webp" alt="보너스 시안 1" loading="lazy" width="510" height="1100"></a>
<a class="tile" href="02.png" data-number="02" aria-label="2번 시안 크게 보기"><span>02</span><img src="02.webp" alt="보너스 시안 2" loading="lazy" width="510" height="1100"></a>
<a class="tile" href="03.png" data-number="03" aria-label="3번 시안 크게 보기"><span>03</span><img src="03.webp" alt="보너스 시안 3" loading="lazy" width="510" height="1100"></a>
<a class="tile" href="04.png" data-number="04" aria-label="4번 시안 크게 보기"><span>04</span><img src="04.webp" alt="보너스 시안 4" loading="lazy" width="510" height="1100"></a>
<a class="tile" href="05.png" data-number="05" aria-label="5번 시안 크게 보기"><span>05</span><img src="05.webp" alt="보너스 시안 5" loading="lazy" width="510" height="1100"></a>
<a class="tile" href="06.png" data-number="06" aria-label="6번 시안 크게 보기"><span>06</span><img src="06.webp" alt="보너스 시안 6" loading="lazy" width="510" height="1100"></a>
<a class="tile" href="07.png" data-number="07" aria-label="7번 시안 크게 보기"><span>07</span><img src="07.webp" alt="보너스 시안 7" loading="lazy" width="510" height="1100"></a>
<a class="tile" href="08.png" data-number="08" aria-label="8번 시안 크게 보기"><span>08</span><img src="08.webp" alt="보너스 시안 8" loading="lazy" width="510" height="1100"></a>
<a class="tile" href="09.png" data-number="09" aria-label="9번 시안 크게 보기"><span>09</span><img src="09.webp" alt="보너스 시안 9" loading="lazy" width="510" height="1100"></a>
<a class="tile" href="10.png" data-number="10" aria-label="10번 시안 크게 보기"><span>10</span><img src="10.webp" alt="보너스 시안 10" loading="lazy" width="510" height="1100"></a></main><dialog aria-label="보너스 시안 확대"><div class="bar"><strong id="number">01</strong><button id="zoom" aria-pressed="false">확대</button><a id="original" target="_blank" rel="noopener">원본 PNG</a><button id="close">닫기 ×</button></div><div class="full"><img id="full-image" alt=""></div><button class="prev" aria-label="이전 시안">‹</button><button class="next" aria-label="다음 시안">›</button></dialog><script>
const dialog=document.querySelector('dialog'),full=document.querySelector('.full'),image=document.querySelector('#full-image'),zoom=document.querySelector('#zoom');let current=1,lastLink;
function show(n){current=(n+9)%10+1;const tag=String(current).padStart(2,'0');document.querySelector('#number').textContent=tag;image.src=tag+'.png';image.alt=current+'번 보너스 시안';document.querySelector('#original').href=tag+'.png';full.classList.remove('zoom');zoom.setAttribute('aria-pressed','false');full.scrollTop=0;if(!dialog.open)dialog.showModal()}
document.querySelectorAll('.tile').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();lastLink=a;show(Number(a.dataset.number))}));document.querySelector('#close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>lastLink?.focus());document.querySelector('.prev').onclick=()=>show(current-1);document.querySelector('.next').onclick=()=>show(current+1);zoom.onclick=()=>{const yes=full.classList.toggle('zoom');zoom.setAttribute('aria-pressed',String(yes));if(yes)full.scrollTop=(image.scrollHeight-full.clientHeight)*.52};dialog.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});
</script></body></html>
